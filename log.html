<!DOCTYPE html>
<html>
  <head>
    <title>CS GSI Log Output</title>
    <style>
      body {
        margin: 0;
        font-family: monospace;
      }
      #toolbar {
        position: sticky;
        top: 0;
        padding: 5px;
        background: #eee;
      }
      #log {
        padding: 5px;
      }
      pre {
        margin: 0 0 10px;
        white-space: pre-wrap;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <div id="toolbar">
      <label><input type="checkbox" id="pause" /> Pause</label>
      <button id="clear">Clear</button>
    </div>
    <div id="log"></div>
    <script>
      const { ipcRenderer } = require("electron");

      // GSI sends up to ~10 messages/s; keep the DOM bounded
      const MAX_ENTRIES = 200;
      const logElement = document.getElementById("log");
      const pauseElement = document.getElementById("pause");

      document.getElementById("clear").addEventListener("click", () => {
        logElement.replaceChildren();
      });

      function format(message) {
        try {
          return JSON.stringify(JSON.parse(message), null, 2);
        } catch (e) {
          return String(message);
        }
      }

      ipcRenderer.on("log", (event, message) => {
        if (pauseElement.checked) return;

        const atBottom =
          window.innerHeight + window.scrollY >=
          document.body.scrollHeight - 20;

        const entry = document.createElement("pre");
        entry.textContent = format(message);
        logElement.appendChild(entry);

        while (logElement.childElementCount > MAX_ENTRIES) {
          logElement.firstElementChild.remove();
        }

        if (atBottom) window.scrollTo(0, document.body.scrollHeight);
      });
    </script>
  </body>
</html>
